builders:
  native_bridge_kit_dart_gen:
    import: "package:native_bridge_kit_dart_gen/native_bridge_kit_dart_gen.dart"
    builder_factories: ["nativeBridgeBuilder"]
    # SharedPartBuilder outputs intermediate .g.part files; the
    # source_gen combining_builder merges them into the final .g.dart.
    build_extensions: {".dart": [".native_bridge_kit.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
